name: GCS Performance Engine

on:
  push:
    branches:
      - agent/gcs-performance-engine
    paths:
      - '.github/workflows/gcs-performance-engine.yml'
      - 'gcs-engine/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-engine:
    name: Build GCS optimized DX11 engine
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      XRAY_REPO: https://github.com/themrdemonized/xray-monolith.git
      XRAY_COMMIT: f3f5a8a3b5233205ff9764b1f5fd10ddaf31045e
      SOLUTION: src/engine-vs2022.sln

    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Configure pagefile
        uses: al-cheb/configure-pagefile-action@v1.3
        continue-on-error: true
        with:
          minimum-size: 8GB
          maximum-size: 8GB
          disk-root: 'C:'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Fetch exact X-Ray MT source
        shell: pwsh
        run: |
          git clone --recursive --branch all-in-one-vs2022-wpo-mt $env:XRAY_REPO engine
          Set-Location engine
          git checkout --detach $env:XRAY_COMMIT
          git submodule sync --recursive
          git submodule update --init --recursive
          git rev-parse HEAD

      - name: Apply GCS Pass 1 optimizations
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE/gcs-engine/apply_pass1.py" "$env:GITHUB_WORKSPACE/engine"

      - name: Apply GCS Pass 2 optimizations
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE/gcs-engine/apply_pass2.py" "$env:GITHUB_WORKSPACE/engine"
          git -C engine diff --check
          git -C engine diff --stat

      - name: Build DX11
        shell: pwsh
        working-directory: engine
        run: msbuild /m /p:Configuration=DX11 /p:Platform=x64 $env:SOLUTION

      - name: Collect outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Get-ChildItem 'engine/_build/_game/bin_dbg' -File | Where-Object { $_.Extension -in '.exe','.pdb' } | Copy-Item -Destination artifact
          Get-FileHash artifact/* -Algorithm SHA256 | Format-Table -AutoSize | Out-File artifact/SHA256SUMS.txt
          @(
            "upstream_repo=$env:XRAY_REPO",
            "upstream_commit=$env:XRAY_COMMIT",
            "optimization_pass=2",
            "configuration=DX11",
            "harness_commit=${{ github.sha }}",
            "runner=$env:RUNNER_OS"
          ) | Out-File artifact/BUILD_INFO.txt
          git -C engine diff | Out-File artifact/GCS_PASS2_SOURCE_DIFF.patch

      - name: Upload optimized artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GCS-Performance-Engine-Pass2-DX11
          path: artifact
          if-no-files-found: error
          retention-days: 14
